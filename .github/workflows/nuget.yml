name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  # 1. ADIM: Test Süreci
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore --verbosity normal


  # 2. ADIM: Derleme, Paketleme ve Yükleme
  publish:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      # Tag'den versiyonu al
      - name: Get Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT


      # Restore
      - name: Restore
        run: dotnet restore src/Resultron/Resultron.csproj


      # Build
      - name: Build
        run: dotnet build src/Resultron/Resultron.csproj --configuration Release --no-restore


      # Pack
      - name: Pack
        run: |
          dotnet pack src/Resultron/Resultron.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }}


      # NuGet Trusted Publishing (OIDC)
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ferdikurnazdm


      # Push
      - name: Push
        run: |
          dotnet nuget push src/Resultron/bin/Release/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json